<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Aid - Sabeel Institute Houston</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="bg-[#FAF6F0] text-[#1F1F1F] font-sans antialiased flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="flex-grow">
    <!-- Hero Banner -->
    <section class="relative bg-gradient-to-b from-[#711F35] to-[#581829] text-white py-20 overflow-hidden">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
        <span class="inline-block px-4 py-1.5 rounded-full bg-[#D39E57]/20 text-[#D39E57] text-xs font-semibold tracking-wider uppercase mb-4">Accessible Knowledge</span>
        <h1 class="font-serif text-4xl sm:text-5xl lg:text-6xl font-bold mb-6">Financial Assistance</h1>
        <p class="text-xl max-w-2xl mx-auto text-[#FAF6F0]/90 font-light leading-relaxed">
          We believe financial constraints should never prevent dedicated female students from accessing sacred learning.
        </p>
      </div>
    </section>

    <!-- Application Form Section -->
    <section class="py-16 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="bg-white p-8 sm:p-12 rounded-3xl border border-[#E8DFC8] shadow-sm">
        <h2 class="font-serif text-2xl font-bold text-[#711F35] mb-2">Hikam Scholarship Application</h2>
        <p class="text-gray-600 text-sm mb-8">Please fill out this form completely. All submitted information remains strictly confidential.</p>

        <form class="space-y-6" onsubmit="event.preventDefault(); alert('Application submitted successfully!');">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">First Name</label>
              <input type="text" required class="w-full p-3 rounded-lg border border-[#E8DFC8] text-sm focus:ring-[#711F35]" />
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Last Name</label>
              <input type="text" required class="w-full p-3 rounded-lg border border-[#E8DFC8] text-sm focus:ring-[#711F35]" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Email Address</label>
            <input type="email" required class="w-full p-3 rounded-lg border border-[#E8DFC8] text-sm focus:ring-[#711F35]" />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Program of Interest</label>
            <select class="w-full p-3 rounded-lg border border-[#E8DFC8] text-sm focus:ring-[#711F35]">
              <option>Hikam Seminary (Full Program)</option>
              <option>Fiqh of Purification Short Course</option>
              <option>Tafsir Surah Al-Kahf</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Level of Aid Requested</label>
            <select class="w-full p-3 rounded-lg border border-[#E8DFC8] text-sm focus:ring-[#711F35]">
              <option>Partial Tuition Assistance (50%)</option>
              <option>Full Tuition Assistance (100%)</option>
              <option>Payment Plan Request</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Statement of Interest & Need</label>
            <textarea rows="4" required placeholder="Briefly describe your interest in the course and why you are applying for assistance..." class="w-full p-3 rounded-lg border border-[#E8DFC8] text-sm focus:ring-[#711F35]"></textarea>
          </div>
          <button type="submit" class="w-full py-3.5 bg-[#711F35] text-white font-bold rounded-xl hover:bg-[#581829] transition-colors">
            Submit Assistance Request
          </button>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
