name: Change scope

# Marks structural pull requests. A file is routine content when
# .github/CODEOWNERS leaves it without an owner; the admin owns every other
# file, so the ruleset holds a pull request that changes one until the admin
# approves it. This workflow shows why: a structural pull request gets the
# "structural" label and a comment that names its files outside routine
# content. GitHub runs this file from main (pull_request_target), so a pull
# request cannot change the rules that judge it. It never checks out or runs
# pull-request code: it reads only the list of changed files and CODEOWNERS
# on main.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  classify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A newer push to the same pull request replaces a run still in progress.
    concurrency:
      group: scope-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Classify the changed files
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'structural';
            const marker = '<!-- change-scope -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;

            // CODEOWNERS as GitHub reads it for this pull request: from the
            // base branch, where the last pattern that matches a file names
            // its owners. A file with no owner is routine.
            const { data: codeowners } = await github.rest.repos.getContent({ owner, repo, path: '.github/CODEOWNERS', ref: pr.base.ref });
            const rules = Buffer.from(codeowners.content, 'base64').toString()
              .split('\n')
              .map((line) => line.trim())
              .filter((line) => line && !line.startsWith('#'))
              .map((line) => {
                const [pattern, ...owners] = line.split(/\s+/);
                if (pattern !== '*' && !/^\/[^*?[\]\\!]+$/.test(pattern)) {
                  throw new Error(`.github/CODEOWNERS: "${pattern}" is not "*", "/folder/", or "/file", the patterns this workflow reads`);
                }
                return { path: pattern.slice(1), owned: owners.length > 0 };
              });
            // "*" leaves an empty path, which matches every file.
            const matches = (rule, file) =>
              rule.path === '' || (rule.path.endsWith('/') ? file.startsWith(rule.path) : file === rule.path || file.startsWith(`${rule.path}/`));
            const isRoutine = (file) => !rules.findLast((rule) => matches(rule, file))?.owned;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: issue_number, per_page: 100 });
            // A renamed file counts by both its old and its new path.
            const paths = new Set(files.flatMap((f) => [f.filename, f.previous_filename].filter(Boolean)));
            const outside = [...paths].filter((p) => !isRoutine(p)).sort();
            // GitHub lists at most 3,000 files; unlisted ones cannot be judged.
            const unlisted = pr.changed_files > files.length;
            const structural = outside.length > 0 || unlisted;

            const labels = (await github.paginate(github.rest.issues.listLabelsOnIssue, { owner, repo, issue_number })).map((l) => l.name);
            if (structural && !labels.includes(LABEL)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });
            } else if (!structural && labels.includes(LABEL)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: LABEL });
            }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            const list = outside.slice(0, 50).map((p) => `- \`${p}\``);
            if (outside.length > 50) list.push(`- and ${outside.length - 50} more`);
            if (unlisted) list.push(`- more files than GitHub lists (${pr.changed_files} changed)`);
            const body = structural
              ? `${marker}\n**Structural change.** This pull request changes files outside routine content (courses, teachers, testimonials, places, the home page's photos, and page photos), so it can be merged only after the admin approves it:\n\n${list.join('\n')}`
              : `${marker}\n**Routine change.** Only routine content files changed, so it can be merged once the \`build\` check passes.`;
            // A routine pull request gets a comment only to replace an earlier structural one.
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (structural) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
