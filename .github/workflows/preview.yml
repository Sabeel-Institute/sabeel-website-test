name: Preview

# Publishes a pull request's built site to a preview channel, with the visual
# comparison site.yml made at /_visual-diff/, and comments the links on the
# pull request. The channel keeps only its latest version, and is deleted when
# the pull request closes. GitHub always runs this file from main, so pull
# request branches cannot change what it does. It never executes code from the
# pull request: it only publishes the static files that site.yml built.

on:
  workflow_run:
    workflows: [Site]
    types: [completed]
  # Runs from main when a pull request closes, merged or not; delete-preview
  # checks out only main's Firebase settings.
  pull_request_target:
    types: [closed]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FIREBASE_TOOLS: firebase-tools@15

jobs:
  # The open pull request this Site run built. A pull request that closed
  # before its build finished gets no preview, so delete-preview's work stays
  # done.
  find-pr:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number="$PR_NUMBER"
          if [[ -z "$number" ]]; then
            number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" -q '.[0].number')"
          fi
          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            echo "No pull request found for $HEAD_SHA, so no preview"
            exit 0
          fi
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" -q .state)" != open ]]; then
            echo "Pull request #$number is closed, so no preview"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  deploy-preview:
    needs: find-pr
    if: needs.find-pr.outputs.number != ''
    runs-on: ubuntu-latest
    # On the job, so that runs which skip it do not cancel a deploy in progress.
    concurrency:
      group: preview-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .firebaserc
            firebase.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The preview goes out without the visual comparison if site.yml could
      # not make it.
      - name: Add visual comparison
        id: visual
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: visual-diff
          path: artifact/dist/_visual-diff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The report comes from pull request code: it must be small, and its
      # summary must be a single object of five whole-number counts.
      - name: Read visual comparison counts
        id: counts
        if: steps.visual.outcome == 'success'
        run: |
          report=artifact/dist/_visual-diff
          size=$(du -sb "$report" | cut -f1)
          if (( size > 50000000 )); then
            echo "::warning::Leaving out the visual comparison: it is $size bytes, over the 50 MB limit"
            rm -rf "$report"
          elif jq -e -s 'length == 1 and (.[0] | type == "object" and keys == ["added", "different", "failed", "removed", "unchanged"] and all(.[]; type == "number" and . >= 0 and . < 100000 and . == floor))' "$report/summary.json" > /dev/null; then
            jq -r 'to_entries[] | "\(.key)=\(.value)"' "$report/summary.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Leaving out the visual comparison: $report/summary.json is missing or invalid"
            rm -rf "$report"
          fi

      # Keep only static hosting settings from the pull request's firebase.json,
      # so a pull request cannot add deploy hooks or change the deploy target.
      # The site name comes from main's firebase.json.
      - name: Prepare hosting config
        run: |
          jq --slurpfile main firebase.json '.hosting
            | {cleanUrls, trailingSlash, redirects, headers}
            | with_entries(select(.value != null))
            | {hosting: ({site: $main[0].hosting.site} + . + {public: "artifact/dist"})}' \
            artifact/firebase.json > hosting.json
          mv hosting.json firebase.json
          cat firebase.json

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: projects/176680257141/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-action-1388459667@sabeel-website-test.iam.gserviceaccount.com
          token_format: access_token

      - name: Deploy preview channel
        id: preview
        run: |
          npx --yes "$FIREBASE_TOOLS" hosting:channel:deploy "pr-${{ needs.find-pr.outputs.number }}" --expires 7d --json | tee deploy.json
          echo "url=$(jq -r '.result[].url' deploy.json)" >> "$GITHUB_OUTPUT"
          echo "expires=$(jq -r '.result[].expireTime' deploy.json)" >> "$GITHUB_OUTPUT"

      # Hosting keeps 10 versions per channel unless told otherwise, and every
      # push to a pull request is a new version of the whole site, so storage
      # would fill up. Keep only the latest.
      - name: Keep only the latest preview version
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          CHANNEL: pr-${{ needs.find-pr.outputs.number }}
        run: |
          site=$(jq -r '.hosting.site' firebase.json)
          curl -fsS -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            "https://firebasehosting.googleapis.com/v1beta1/sites/$site/channels/$CHANNEL?updateMask=retainedReleaseCount" \
            -d '{"retainedReleaseCount": 1}' > /dev/null

      - name: Comment preview URL
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.preview.outputs.url }}
          EXPIRES: ${{ steps.preview.outputs.expires }}
          PR_NUMBER: ${{ needs.find-pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          DIFFERENT: ${{ steps.counts.outputs.different }}
          ADDED: ${{ steps.counts.outputs.added }}
          REMOVED: ${{ steps.counts.outputs.removed }}
          FAILED: ${{ steps.counts.outputs.failed }}
        with:
          script: |
            const marker = '<!-- firebase-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const sha = process.env.HEAD_SHA;
            const report = `${process.env.URL}/_visual-diff/`;
            let changes = null;
            if (process.env.DIFFERENT) {
              const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
              const different = Number(process.env.DIFFERENT);
              const added = Number(process.env.ADDED);
              const removed = Number(process.env.REMOVED);
              const failed = Number(process.env.FAILED);
              changes = [
                different && count(different, 'page looks different', 'pages look different'),
                added && count(added, 'new page', 'new pages'),
                removed && count(removed, 'page removed', 'pages removed'),
                failed && count(failed, 'page could not be captured', 'pages could not be captured'),
              ].filter(Boolean).join(', ') || 'no page looks different';
            }
            const visual = changes
              ? `[${changes}](${report})`
              : `comparison unavailable ([Site run](${process.env.RUN_URL}))`;
            const body = `${marker}\n**Preview:** ${process.env.URL}\n**Visual changes:** ${visual}\n\nBuilt from ${sha.slice(0, 7)}. Expires ${process.env.EXPIRES}.`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: 'success',
              context: 'preview',
              description: 'Preview deployed',
              target_url: process.env.URL,
            });
            // Replaces any earlier result for the same commit, so the check
            // never links to a report this preview does not have.
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state: changes ? 'success' : 'error',
              context: 'visual changes',
              description: changes ? changes[0].toUpperCase() + changes.slice(1) : 'Comparison unavailable',
              target_url: changes ? report : process.env.RUN_URL,
            });

  # Deletes a pull request's preview when it closes, merged or not. It runs
  # from main and checks out only main's .firebaserc and firebase.json.
  delete-preview:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Shares deploy-preview's group, so it cancels a deploy still in progress.
    concurrency:
      group: preview-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .firebaserc
            firebase.json
          sparse-checkout-cone-mode: false

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/176680257141/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-action-1388459667@sabeel-website-test.iam.gserviceaccount.com

      - name: Delete preview channel
        env:
          CHANNEL: pr-${{ github.event.pull_request.number }}
        run: |
          site=$(jq -r '.hosting.site' firebase.json)
          if npx --yes "$FIREBASE_TOOLS" hosting:channel:list --site "$site" --json |
            jq -e --arg c "/channels/$CHANNEL" '.result.channels[] | select(.name | endswith($c))' > /dev/null; then
            npx --yes "$FIREBASE_TOOLS" hosting:channel:delete "$CHANNEL" --site "$site" --force
          else
            echo "No preview channel $CHANNEL"
          fi
