name: Firebase Hosting

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: firebase-hosting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  FIREBASE_TOOLS: firebase-tools@15

jobs:
  deploy:
    # Fork PRs get no OIDC token, so they cannot authenticate to Google.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/176680257141/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-action-1388459667@sabeel-website-test.iam.gserviceaccount.com

      - name: Deploy live site
        if: github.event_name == 'push'
        run: npx --yes "$FIREBASE_TOOLS" deploy --only hosting --non-interactive

      - name: Deploy preview channel
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          npx --yes "$FIREBASE_TOOLS" hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --expires 7d --json | tee deploy.json
          echo "url=$(jq -r '.result[].url' deploy.json)" >> "$GITHUB_OUTPUT"
          echo "expires=$(jq -r '.result[].expireTime' deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.preview.outputs.url }}
          EXPIRES: ${{ steps.preview.outputs.expires }}
        with:
          script: |
            const marker = '<!-- firebase-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Preview:** ${process.env.URL}\n\nBuilt from ${sha}. Expires ${process.env.EXPIRES}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
