name: Site

# Builds every pull request and every push to main. Only pushes to main deploy
# the live site. For pull requests, it also compares screenshots of the pages
# the pull request changes with main. Pull request previews, including that
# comparison, are published by preview.yml, which runs from main after this
# workflow succeeds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  FIREBASE_TOOLS: firebase-tools@15

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: |
            dist
            firebase.json
          if-no-files-found: error
          retention-days: 7

  # Screenshots the pages this pull request changes, before and after, and
  # uploads the report preview.yml publishes at <preview>/_visual-diff/. The
  # preview waits for it but does not depend on it: if it fails, the preview
  # goes out without the report. Its steps have their own time limits because
  # a step that times out fails, which continue-on-error covers, while a job
  # that times out is cancelled, which would stop the preview.
  visual-diff:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/visual-diff/package-lock.json

      # The pull request is checked out merged into its target branch, so the
      # first parent of HEAD is that branch (main) as of the merge GitHub
      # made for this run.
      - name: Build main
        timeout-minutes: 10
        run: |
          git worktree add --detach "$RUNNER_TEMP/main" HEAD^1
          cd "$RUNNER_TEMP/main"
          npm ci
          npx astro build

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ runner.temp }}/pr

      - name: Install comparison tools
        timeout-minutes: 5
        working-directory: scripts/visual-diff
        run: |
          npm ci
          npx playwright install chromium-headless-shell

      - name: Compare screenshots
        timeout-minutes: 15
        run: node scripts/visual-diff/run.mjs --before "$RUNNER_TEMP/main/dist" --after "$RUNNER_TEMP/pr/dist" --out "$RUNNER_TEMP/visual-diff"

      - uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: ${{ runner.temp }}/visual-diff
          if-no-files-found: error
          retention-days: 7

  deploy-live:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site

      # Google grants deploy access only to workflows running from main.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/215221958617/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-action-1388459667@oursabeel-website.iam.gserviceaccount.com

      - name: Deploy live site
        run: npx --yes "$FIREBASE_TOOLS" deploy --only hosting --non-interactive
