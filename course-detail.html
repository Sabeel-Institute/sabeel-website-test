<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Details - Sabeel Institute Houston</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body class="bg-sabeel-ivory text-sabeel-dark font-sans antialiased flex flex-col min-h-screen">
  <div id="header-container"></div>

  <main class="flex-grow py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      <!-- Breadcrumbs -->
      <nav class="flex items-center space-x-2 text-xs text-sabeel-taupe mb-8">
        <a href="index.html" class="hover:text-sabeel-raspberry transition">Home</a>
        <span>/</span>
        <a href="courses.html" class="hover:text-sabeel-raspberry transition">Courses</a>
        <span>/</span>
        <span id="breadcrumb-title" class="text-sabeel-raspberry font-semibold">Course Detail</span>
      </nav>

      <!-- Dynamic Course Content -->
      <div id="course-content-root" class="bg-white rounded-3xl border border-sabeel-gold/20 p-6 sm:p-12 shadow-sm">
        <div class="text-center py-12">
          <p class="text-sabeel-taupe">Loading course information...</p>
        </div>
      </div>

    </div>
  </main>

  <div id="footer-container"></div>

  <script type="module">
    import coursesData from './src/courses_data.json';

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug');

      const course = coursesData.find(c => c.slug === slug) || coursesData[0];
      if (!course) return;

      document.title = `${course.title} - Sabeel Institute`;
      const breadcrumb = document.getElementById('breadcrumb-title');
      if (breadcrumb) breadcrumb.textContent = course.title;

      const container = document.getElementById('course-content-root');
      if (container) {
        container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">

            <!-- Left Column: Flyer/Image -->
            <div class="lg:col-span-5 bg-sabeel-sage-light/30 p-4 rounded-2xl border border-sabeel-gold/30">
              <img src="${course.image}" alt="${course.title}" class="w-full h-auto rounded-xl shadow-xs object-cover" onerror="this.onerror=null; this.src='/images/sabeel-institute-PNG-1.png'" />
              <div class="mt-4 p-4 bg-sabeel-ivory rounded-xl text-center border border-sabeel-gold/10">
                <span class="text-xs font-semibold text-sabeel-gold uppercase tracking-widest block mb-1">Target Audience</span>
                <span class="text-sm font-bold text-sabeel-raspberry">${course.audience}</span>
              </div>
            </div>

            <!-- Right Column: Course Metadata & Details -->
            <div class="lg:col-span-7 space-y-6">
              <div>
                <span class="inline-block px-3.5 py-1 rounded-full bg-sabeel-sage-light text-sabeel-raspberry text-xs font-bold tracking-wider uppercase mb-3 border border-sabeel-sage/40">
                  Open Registration
                </span>
                <h1 class="font-serif text-3xl sm:text-4xl font-bold text-sabeel-raspberry leading-tight">${course.title}</h1>
              </div>

              <!-- Quick Info Grid -->
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-sabeel-ivory/60 p-4 rounded-2xl border border-sabeel-gold/20">
                <div>
                  <span class="block text-[10px] text-sabeel-taupe font-bold uppercase">Fee</span>
                  <span class="text-xs font-bold text-sabeel-raspberry">${course.fee}</span>
                </div>
                <div>
                  <span class="block text-[10px] text-sabeel-taupe font-bold uppercase">Date</span>
                  <span class="text-xs font-bold text-sabeel-dark">${course.date}</span>
                </div>
                <div>
                  <span class="block text-[10px] text-sabeel-taupe font-bold uppercase">Time</span>
                  <span class="text-xs font-bold text-sabeel-dark">${course.time}</span>
                </div>
                <div>
                  <span class="block text-[10px] text-sabeel-taupe font-bold uppercase">Venue</span>
                  <span class="text-xs font-bold text-sabeel-dark">${course.venue}</span>
                </div>
              </div>

              <!-- Description -->
              <div class="space-y-4 pt-2">
                <h3 class="font-serif text-xl font-bold text-sabeel-raspberry border-b border-sabeel-gold/20 pb-2">Course Overview</h3>
                <div class="text-sm text-sabeel-taupe leading-relaxed space-y-3 whitespace-pre-line">
                  ${course.description}
                </div>
              </div>

              <!-- Action CTAs -->
              <div class="pt-6 border-t border-sabeel-gold/20 flex flex-wrap gap-4 items-center">
                <a href="${course.registration_link}" target="_blank" rel="noopener noreferrer" class="bg-sabeel-raspberry hover:bg-sabeel-raspberry-dark text-white px-8 py-3.5 rounded-full font-semibold text-xs uppercase tracking-wider transition shadow-md flex items-center gap-2">
                  Register For This Course
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
                <a href="contact.html" class="bg-sabeel-sage hover:bg-sabeel-sage/80 text-sabeel-dark px-6 py-3.5 rounded-full font-semibold text-xs uppercase tracking-wider transition border border-sabeel-gold/20">
                  Ask a Question
                </a>
              </div>

            </div>

          </div>
        `;
      }
    });
  </script>
</body>
</html>
